name: Build Chill Zone Lifesteal 0.2.0
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build resource mod
        run: gradle clean assemble --console=plain --stacktrace
      - name: Check commands and metadata
        run: |
          unzip -l build/libs/chillzone-lifesteal-server-0.2.0.jar | grep 'data/life_steal/function/chillzone/bootstrap.mcfunction'
          unzip -p build/libs/chillzone-lifesteal-server-0.2.0.jar fabric.mod.json | grep '"environment": "server"'
      - uses: actions/upload-artifact@v4
        with:
          name: chillzone-lifesteal-server-0.2.0-jar
          path: build/libs/chillzone-lifesteal-server-0.2.0.jar
          if-no-files-found: error

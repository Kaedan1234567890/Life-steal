name: Build Chill Zone Lifesteal ALPHA27 (craft/combat)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Print Java and Gradle versions
        run: |
          java -version
          gradle --version
      - name: Compile and package (8-minute timeout)
        shell: bash
        timeout-minutes: 10
        run: |
          set -o pipefail
          # 'timeout' ensures a stalled repository/dependency request fails instead of running indefinitely.
          timeout --signal=TERM --kill-after=20s 8m gradle --no-daemon --console=plain --info --stacktrace clean build 2>&1 | tee build.log
      - name: Upload build log (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chillzone-lifesteal-ALPHA27-build-log
          path: build.log
          if-no-files-found: warn
      - name: Upload compiled mod (only if build succeeds)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chillzone-lifesteal-ALPHA27-jar
          path: build/libs/*.jar
          if-no-files-found: error

name: Build Chill Zone Lifesteal 0.1.2-alpha.3
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'build.gradle', 'gradle.properties', 'settings.gradle', '.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile with full error messages
        run: gradle clean build --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chillzone-lifesteal-0.1.2-alpha.3
          path: build/libs/*.jar
